name: nf-iridanext CI
on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:
    branches:
      - '*'
jobs:
  build:
    name: Build nf-iridanext
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java_version: [17, 21]
        nextflow_version: ['24.10', '25.04']

    steps:
      - name: Environment
        run: env | sort

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          submodules: true

      - name: Setup Java ${{ matrix.java_version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{matrix.java_version}}
          architecture: x64
          distribution: 'temurin'

      - name: Tests
        run: make test
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Setup Nextflow ${{ matrix.nextflow_version }}
        uses: nf-core/setup-nextflow@b9f764e8ba5c76b712ace14ecbfcef0e40ae2dd8 # v1
        with:
          version: "${{ matrix.nextflow_version }}"

      - name: Install
        run: make install

        # Reads the nextflow plugin version from build.gradle
      - name: Get plugin version
        id: plugin-version
        run: echo NF_PLUGIN_VERSION=`sed -n "s/^version *= *'\([^']*\)'/\1/p" build.gradle` >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          # Set offline mode so Nextflow doesn't download published plugins
          NXF_OFFLINE: true
          # The plugin version needs to be explicitly set in offline mode
          NF_PLUGIN_VERSION: ${{ steps.plugin-version.outputs.NF_PLUGIN_VERSION }}
        run: nextflow run validation/ -plugins nf-iridanext@${NF_PLUGIN_VERSION}
